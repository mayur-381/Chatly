version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatly
      POSTGRES_PASSWORD: chatly123
      POSTGRES_DB: chatly
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://chatly:chatly123@db:5432/chatly
      REDIS_URL: redis://redis:6379
      SECRET_KEY: chatly-super-secret-key-2026
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
